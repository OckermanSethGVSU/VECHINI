[run]
output_dir = "../local_sweep_results_from_pbs"
results_csv = "results.csv"
qdrant_version = "latest"
container_name = "qdrant-local-pbs-sweep"
insert_batch_size = 512
query_batch_size = 128
insert_clients = 4
query_clients = 1
streaming = true
resume = true
keep_container = false

[sweep]
top_k = [10, 50, 100]
hnsw_m = [8, 16, 32, 64, 128]
ef_construct = [64, 128, 256, 512]
ef_search = [1, 8, 16, 32, 64, 128, 256, 512, 1024]
number_of_segments = [1, 8, 16, 32, 64, 128]

[[quantization_variants]]
name = "none"
type = "NONE"

[[quantization_variants]]
name = "scalar_default"
type = "SCALAR"

[[quantization_variants]]
name = "binary_1bit"
type = "BINARY"
binary_encoding = "DEFAULT"

[[quantization_variants]]
name = "binary_2bit"
type = "BINARY"
binary_encoding = "TWO_BITS"

[[quantization_variants]]
name = "binary_1_5bit"
type = "BINARY"
binary_encoding = "ONE_AND_HALF_BITS"

[[quantization_variants]]
name = "product_x64"
type = "PRODUCT"
product_compression = "X64"

[[quantization_variants]]
name = "turbo_bits4"
type = "TURBO"
turbo_bits = "BITS4"

[[quantization_variants]]
name = "turbo_bits2"
type = "TURBO"
turbo_bits = "BITS2"

[[quantization_variants]]
name = "turbo_bits1_5"
type = "TURBO"
turbo_bits = "BITS1_5"

[[quantization_variants]]
name = "turbo_bits1"
type = "TURBO"
turbo_bits = "BITS1"

[quantization]
# Legacy defaults used only when [[quantization_variants]] is omitted.
always_ram = true
scalar_quantile = 0.99
binary_encoding = "DEFAULT"
product_compression = "X16"
turbo_bits = "BITS4"

[[datasets]]
name = "bigann_10m"
directory = "../../testData/bigann"
data = "base.1B_crop_nb_10000000.npy"
queries = "query.public.10K.npy"
ground_truth = "bigann-10M.ids.npy"

