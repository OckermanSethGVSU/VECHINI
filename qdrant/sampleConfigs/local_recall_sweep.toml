[run]
output_dir = "../local_sweep_results"
results_csv = "qdrant_recall_sweep.csv"
qdrant_version = "latest"
container_name = "qdrant-local-sweep"
insert_batch_size = 512
query_batch_size = 128
insert_clients = 4
query_clients = 1
streaming = true
resume = true
keep_container = false

[pbs]
# Queue state and unit outputs must live on one shared parallel filesystem.
queue_dir = "../pbs_sweep_queue"
qdrant_sif = "../sifs/qdrant_latest.sif"
# Use node-local storage for Qdrant data. TMPDIR is used when this is omitted.
scratch_root = "/tmp"
heartbeat_seconds = 30
stale_after_seconds = 900
# Zero means keep claiming units until the queue is empty or walltime reserve.
worker_max_units = 0
stop_before_seconds = 300
account = ""
queue = ""
queue_candidates = ["debug", "debug-scaling", "capacity"]
queue_limits = [1, 1, 5]
queue_queued_limits = [1, 1, 5]
submit_username = ""
watch_poll_seconds = 30
aggregate_on_complete = true
walltime = "06:00:00"
place = "excl"
platform = "AURORA"
apptainer_args = []
setup_commands = ["module load apptainer", "module load frameworks"]

[sweep]
top_k = [10, 50, 100]
hnsw_m = [8, 16, 32, 64, 128, 256, 512]
ef_construct = [64, 128, 256, 512]
ef_search = [1, 8, 16, 32, 64, 128, 256, 512, 1024]
number_of_segments = [1, 2, 4, 8, 16, 32, 64, 128]

[[quantization_variants]]
name = "none"
type = "NONE"

[[quantization_variants]]
name = "scalar_default"
type = "SCALAR"

[[quantization_variants]]
name = "scalar_q999"
type = "SCALAR"
scalar_quantile = 0.999

[[quantization_variants]]
name = "scalar_q99"
type = "SCALAR"
scalar_quantile = 0.99

[[quantization_variants]]
name = "scalar_q95"
type = "SCALAR"
scalar_quantile = 0.95

[[quantization_variants]]
name = "scalar_q90"
type = "SCALAR"
scalar_quantile = 0.90

[[quantization_variants]]
name = "binary_1bit"
type = "BINARY"
binary_encoding = "DEFAULT"

[[quantization_variants]]
name = "binary_2bit"
type = "BINARY"
binary_encoding = "TWO_BITS"

[[quantization_variants]]
name = "binary_1_5bit"
type = "BINARY"
binary_encoding = "ONE_AND_HALF_BITS"

[[quantization_variants]]
name = "product_x4"
type = "PRODUCT"
product_compression = "X4"

[[quantization_variants]]
name = "product_x8"
type = "PRODUCT"
product_compression = "X8"

[[quantization_variants]]
name = "product_x16"
type = "PRODUCT"
product_compression = "X16"

[[quantization_variants]]
name = "product_x32"
type = "PRODUCT"
product_compression = "X32"

[[quantization_variants]]
name = "product_x64"
type = "PRODUCT"
product_compression = "X64"

[[quantization_variants]]
name = "turbo_bits4"
type = "TURBO"
turbo_bits = "BITS4"

[[quantization_variants]]
name = "turbo_bits2"
type = "TURBO"
turbo_bits = "BITS2"

[[quantization_variants]]
name = "turbo_bits1_5"
type = "TURBO"
turbo_bits = "BITS1_5"

[[quantization_variants]]
name = "turbo_bits1"
type = "TURBO"
turbo_bits = "BITS1"

[quantization]
# Legacy defaults used only when [[quantization_variants]] is omitted.
always_ram = true
scalar_quantile = 0.99
binary_encoding = "DEFAULT"
product_compression = "X16"
turbo_bits = "BITS4"

# Paths in each dataset entry are relative to its directory. The distance
# metric is read from that directory's distance_metric.txt.

[[datasets]]
name = "bigann_10m"
directory = "../../testData/bigann"
data = "base.1B_crop_nb_10000000.npy"
queries = "query.public.10K.npy"
ground_truth = "bigann-10M.ids.npy"

